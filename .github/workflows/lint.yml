name: Lint

# actionlint on the workflow, plus a launcher-side guard that the workflow_dispatch
# inputs still match the dispatch contract the CLI relies on (config.WORKFLOW_INPUTS).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        # Digest-pinned actionlint image (tag 1.7.12). shellcheck integration is
        # disabled (-shellcheck=) so the gate first covers workflow syntax and
        # expression errors; enable shellcheck later behind a shell-cleanup pass.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color -shellcheck=

  dispatch_contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: dispatch contract, parent pin, and CWL-release invariants
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import re, sys, yaml
          wf = yaml.safe_load(open(".github/workflows/build-external.yml", encoding="utf-8"))
          # PyYAML parses the bare `on:` key as the boolean True.
          on = wf.get("on", wf.get(True))
          got = set(on["workflow_dispatch"]["inputs"])
          expected = {"repo_url", "ref", "correlation_id", "bypass_gate"}
          if got != expected:
              print(f"::error::workflow_dispatch inputs {sorted(got)} != contract {sorted(expected)}")
              sys.exit(1)
          print("dispatch inputs match the CLI WORKFLOW_INPUTS contract")
          # Release invariant: the 4 parent-pipeline reusable workflows are pinned
          # to ONE identical 40-hex commit SHA (never @main). A hand-bump of 3 of
          # 4 would otherwise ship a silent split-version production run.
          refs = [j["uses"] for j in wf["jobs"].values()
                  if isinstance(j, dict)
                  and j.get("uses", "").startswith("cgi-italy/insula-processors-parent-pipeline/")]
          shas = {u.rsplit("@", 1)[1] for u in refs}
          if len(refs) != 4 or len(shas) != 1 or not re.fullmatch(r"[0-9a-f]{40}", next(iter(shas))):
              print(f"::error::parent-pipeline uses: refs must be 4 identical 40-hex SHA pins; got {len(refs)} refs, pins {sorted(shas)}")
              sys.exit(1)
          print(f"4 parent-pipeline refs pinned to one SHA: {next(iter(shas))}")
          # Contract 2's delivery leg: the finalize job must publish the CWL as a
          # Release tagged 'cwl-<correlation_id>' (the CLI looks it up by that tag),
          # gated on the `swr` environment, and must NOT ship a public artifact.
          finalize = wf["jobs"]["finalize_cwl"]
          if finalize.get("environment") != "swr":
              print("::error::finalize_cwl must run in the 'swr' environment (gates the CWL-publish App secrets)")
              sys.exit(1)
          steps = finalize["steps"]
          if any(s.get("uses", "").startswith("actions/upload-artifact") for s in steps):
              print("::error::finalize_cwl must not upload an artifact; it publishes a Release instead")
              sys.exit(1)
          if not any(s.get("uses", "").startswith("actions/create-github-app-token") for s in steps):
              print("::error::finalize_cwl must mint the CWL-publish App token (actions/create-github-app-token)")
              sys.exit(1)
          runs = "\n".join(s.get("run", "") for s in steps)
          if "gh release create" not in runs or 'TAG="cwl-${CID}"' not in runs:
              print("::error::finalize_cwl must create a Release tagged cwl-<correlation_id> (CLI RELEASE_TAG_PREFIX)")
              sys.exit(1)
          print("finalize_cwl publishes the CWL as a cwl-<correlation_id> Release")
          # The CLI locates its run by correlation_id in run-name; dropping it would
          # strand every dispatch (find_run never matches).
          if "correlation_id" not in (wf.get("run-name") or ""):
              print("::error::run-name must embed ${{ inputs.correlation_id }} (the CLI's run locator)")
              sys.exit(1)
          print("run-name embeds correlation_id")
          # Each reusable-workflow call must pass its required inputs via with:; a
          # missing key only surfaces at a live dispatch otherwise.
          required_with = {
              "scan_secrets": {"repo_slug", "ref"},
              "build_image": {"swr_registry", "swr_staging_org", "base_registry", "repo_slug", "ref", "app_name"},
              "security": {"image_name", "swr_registry"},
              "publish": {"image_name", "swr_prod_org", "app_name"},
          }
          for job, need in required_with.items():
              have = set((wf["jobs"].get(job, {}).get("with") or {}))
              missing = need - have
              if missing:
                  print(f"::error::job {job} missing with: keys {sorted(missing)}")
                  sys.exit(1)
          print("reusable-call with: blocks carry the required inputs")
          PY
